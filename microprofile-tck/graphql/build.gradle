plugins { id 'io.micronaut.build.internal.cdi-test-suite' }

ext.mpTck = [component: 'graphql', artifact: 'org.eclipse.microprofile.graphql:microprofile-graphql-tck:2.0', sourceClassifier: 'sources', framework: 'testng']
apply from: rootProject.file('microprofile-tck/tck.gradle')

dependencies {
    testImplementation 'io.smallrye:smallrye-graphql-cdi:2.18.5'
    testImplementation 'org.eclipse.parsson:parsson:1.1.7'
    testImplementation 'org.eclipse:yasson:3.0.4'
    testImplementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    testImplementation 'org.osgi:org.osgi.annotation.versioning:1.1.2'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'io.smallrye:smallrye-graphql-schema-builder:2.18.5'
}

// DynamicPaths locates the official test vectors through its own JAR code source, as upstream intended.
def testArchive = tasks.register('tckTestArchive', Jar) {
    dependsOn tasks.named('testClasses')
    archiveClassifier = 'tck-tests'
    from sourceSets.test.output
}
tasks.matching { it.name in ['tckSuite', 'tckImportedSuite', 'tckReferenceSuite'] }.configureEach {
    dependsOn testArchive
    classpath = files(testArchive) + (sourceSets.test.runtimeClasspath - sourceSets.test.output)
    doFirst { file('src/test/resources/tests').mkdirs() }
}

dependencies { testImplementation 'jakarta.validation:jakarta.validation-api:3.1.1' }
