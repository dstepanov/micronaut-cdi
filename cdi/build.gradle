plugins {
    id "io.micronaut.build.internal.cdi-module"
}

// Resolving and injecting a bean reads nothing back from its class: what a bean is was decided while it was compiled.
// What is allowed below is handling the java.lang.reflect.Type the interfaces of the specification are written
// in: a bean type, a required type and an event type are Types, and comparing two of them reads their arguments
// and bounds. No class is read back for it - its hierarchy, its members, its annotations - which is what the
// optional micronaut-cdi-reflection module does where an application asks. Each class is allowed only the kind it
// reaches for, so that anything new, anywhere, fails the build until it is either removed or listed here with its
// reason.
noReflection {
    // the types of the specification's typesafe resolution: a bean type or a required type is a
    // java.lang.reflect.Type, and its arguments and bounds are what section 2.4.2 compares
    allowIn 'io.micronaut.cdi.runtime.CdiAssignability', 'GENERIC_SIGNATURES'
    allowIn 'io.micronaut.cdi.runtime.CdiParameterizedType', 'GENERIC_SIGNATURES'
    // the bounds of a type variable are recorded by name and loaded when a Type is asked for
    allowIn 'io.micronaut.cdi.runtime.CdiTypes', 'GENERIC_SIGNATURES', 'CLASS_LOADING'
    allowIn 'io.micronaut.cdi.runtime.CdiInjectionPointFactory', 'GENERIC_SIGNATURES'
    // the bean types of a bean are reported as Types (section 2.2.1), composed from what the processor recorded
    allowIn 'io.micronaut.cdi.runtime.CdiBean', 'GENERIC_SIGNATURES'
    // the type an event is selected and fired as is a java.lang.reflect.Type
    allowIn 'io.micronaut.cdi.runtime.CdiEvent', 'GENERIC_SIGNATURES'
    // a bean type handed to the bean manager is a java.lang.reflect.Type
    allowIn 'io.micronaut.cdi.runtime.CdiBeanContainer', 'GENERIC_SIGNATURES'

    // a type recorded while the application compiled - what an observer observes, a type an extension composed -
    // is handed out as the java.lang.reflect.Type the specification's interfaces are written in, composed from
    // the classes that were recorded
    allowIn 'io.micronaut.cdi.runtime.RecordedTypes', 'GENERIC_SIGNATURES'
    allowIn 'io.micronaut.cdi.runtime.RecordedTypeIndex', 'GENERIC_SIGNATURES'
}

dependencies {
    annotationProcessor libs.managed.micronaut.jakarta.interceptors.processor

    api libs.managed.jakarta.cdi.api
    api libs.managed.jakarta.inject.api
    api libs.managed.jakarta.annotation.api
    api libs.managed.jakarta.interceptor.api
    api libs.managed.micronaut.jakarta.interceptors
    api mn.micronaut.core
    api mn.micronaut.aop
    api mn.micronaut.inject
    api mn.micronaut.context

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
