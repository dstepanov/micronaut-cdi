plugins { id 'io.micronaut.build.internal.cdi-test-suite' }

ext.mpTck = [component: 'metrics-optional', artifact: 'org.eclipse.microprofile.metrics:microprofile-metrics-optional-tck:5.1.2', sourceClassifier: 'sources', framework: 'junit4']
apply from: rootProject.file('microprofile-tck/tck.gradle')

dependencies {
    testImplementation 'io.smallrye:smallrye-metrics:5.1.0'
    testImplementation 'org.eclipse.parsson:parsson:1.1.7'
    testImplementation 'org.eclipse:yasson:3.0.4'
    testImplementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    testImplementation 'org.osgi:org.osgi.annotation.versioning:1.1.2'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
}

dependencies { testImplementation 'org.eclipse.microprofile.metrics:microprofile-metrics-api:5.1.2' }
