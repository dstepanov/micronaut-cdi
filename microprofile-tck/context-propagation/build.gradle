plugins { id 'io.micronaut.build.internal.cdi-test-suite' }

ext.mpTck = [
    component: 'context-propagation',
    artifact: 'org.eclipse.microprofile.context-propagation:microprofile-context-propagation-tck:1.3',
    sourceClassifier: 'sources',
    framework: 'testng'
]

apply from: rootProject.file('microprofile-tck/tck.gradle')

dependencies {
    testImplementation 'io.smallrye:smallrye-context-propagation:2.4.0'
    testImplementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
}

dependencies {
    testImplementation 'io.smallrye:smallrye-context-propagation-cdi:2.4.0'
    testImplementation 'io.smallrye:smallrye-context-propagation-jta:2.4.0'
}

configurations { contextLite }
dependencies { contextLite projects.micronautMicroprofileTckContextLite }

tasks.register('tckLiteSuite', Test) {
    group = 'verification'
    description = 'Runs the unchanged Context Propagation TCK with the Micronaut CDI Lite adapter.'
    dependsOn tasks.named('upstreamSuite'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter {
        !it.name.startsWith('smallrye-context-propagation-cdi-') &&
        !it.name.startsWith('smallrye-context-propagation-jta-')
    } + configurations.contextLite
    useTestNG()
    scanForTestClasses = false
    failOnNoDiscoveredTests = true
    maxHeapSize = '2g'
    maxParallelForks = 1
    forkEvery = 1
    ignoreFailures = providers.gradleProperty('mpTckIgnoreFailures').isPresent()
    outputs.upToDateWhen { false }
    systemProperty 'mp.tck.component', 'context-propagation'
    systemProperty 'mp.tck.mode', 'lite'
    systemProperty 'mp.tck.sources', layout.buildDirectory.dir('upstream').get().asFile.absolutePath
    systemProperty 'mp.tck.evidence', layout.buildDirectory.dir('deployments/lite').get().asFile.absolutePath
    systemProperty 'mp.tck.buildExtensions', 'io.micronaut.cdi.microprofile.context.ContextBuildExtension'
    systemProperty 'mp.tck.imports', 'io.micronaut.cdi.microprofile.context.ContextAccess,io.micronaut.cdi.microprofile.context.ContextProducers'
    doFirst {
        include layout.buildDirectory.file('selected-tests.txt').get().asFile.readLines()
            .findAll { !it.isBlank() }.collect { it.replace('.', '/') + '.class' }
        delete layout.buildDirectory.dir('deployments/lite')
        systemProperty 'mp.tck.classpath', classpath.asPath
    }
}
