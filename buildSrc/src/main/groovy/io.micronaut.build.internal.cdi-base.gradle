repositories {
    // a Micronaut built from a checkout beside this one, published with publishToMavenLocal. It is consulted
    // first so that a fix being worked on in Micronaut itself can be built against here before it is released;
    // where nothing has been published locally, the release on Maven Central is what resolves
    mavenLocal()
    mavenCentral()
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
