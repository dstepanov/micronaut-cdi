repositories {
    // a Micronaut built from a checkout beside this one, published with publishToMavenLocal. It is consulted
    // first so that a fix being worked on in Micronaut itself can be built against here before it is released;
    // where nothing has been published locally, the release on Maven Central is what resolves. A stale local
    // publication of a snapshot shadows the published one; -PnoMavenLocal leaves the local repository out
    if (!providers.gradleProperty('noMavenLocal').isPresent()) {
        mavenLocal()
    }
    mavenCentral()
    // the snapshot of Micronaut Core the language model builds on, until the accessors it uses are released
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        mavenContent {
            snapshotsOnly()
        }
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
