pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.0.1'
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        // the snapshot of Micronaut Core the language model builds on, until the accessors it uses are released
        maven {
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
            mavenContent {
                snapshotsOnly()
            }
        }
    }
}

rootProject.name = 'cdi-parent'

include 'cdi'
include 'cdi-bom'
include 'cdi-el'
include 'cdi-lang-model-ast'
include 'cdi-processor'
include 'cdi-reflection'
include 'cdi-tck'
include 'cdi-tck-lang-model'
include 'test-suite-extension'
include 'test-suite-java'
include 'test-suite-kotlin'
include 'test-suite-groovy'
include 'test-suite-no-reflection'

// Jakarta Interceptors and Jakarta Expression Language are implemented by sibling projects rather than again here:
// the interception of a bean and the evaluation of an expression are the business of their own specifications, and
// Contexts and Dependency Injection defers to them.
//
// Jakarta Interceptors is a source dependency, built at the head of its main branch: its modules are mapped to its
// repository, which Gradle checks out under .gradle/vcs-1 and includes as a build. A source dependency is selected
// by a branch rather than by the version the catalog names, and the branch is set on the dependencies by the
// convention plugin io.micronaut.build.internal.cdi-base. Each build that resolves it fetches the head of the branch.
//
// Jakarta Expression Language is the release the catalog names, from Maven Central.
//
// A checkout of your own is included instead, in place of either, when its directory is given with
// -PjakartaInterceptorsDir=... or -PjakartaElDir=...
def siblingCheckout = { String property ->
    def given = providers.gradleProperty(property).orNull
    if (given == null) {
        return false
    }
    def dir = file(given)
    if (!dir.directory) {
        throw new GradleException("${property} names ${dir}, which is not a directory")
    }
    includeBuild(dir)
    return true
}

if (!siblingCheckout('jakartaInterceptorsDir')) {
    sourceControl {
        gitRepository(uri('https://github.com/dstepanov/micronaut-jakarta-interceptors.git')) {
            producesModule('io.micronaut.interceptor:micronaut-jakarta-interceptors')
            producesModule('io.micronaut.interceptor:micronaut-jakarta-interceptors-processor')
        }
    }
}
siblingCheckout('jakartaElDir')

micronautBuild {
    useStandardizedProjectNames.set(true)
    importMicronautCatalog()
}
