plugins {
    id "io.micronaut.build.internal.cdi-module"
}

noReflection {
    // reading the application back reflectively is what this module is for
    allowIn 'io.micronaut.cdi.reflection.*'
}

// The parts of the specification's API that hand out reflection objects.
//
// Micronaut resolves and injects a bean without reflecting, and micronaut-cdi implements the specification the same
// way: what a bean is was decided while it was compiled, and the phases of a build compatible extension run while
// the application compiles. What is left is the API a program calls that is written in terms of reflection - the
// Member of an injection point and its Annotated model, an annotation instance, the annotations of an annotation
// class the build never saw. This module implements the CdiReflection interface those calls go through.
//
// That is why it is a module of its own rather than part of the runtime: an application that calls none of that
// API does not have it, and one that does asks for it by adding this dependency. Without it each such call fails
// with an UnsupportedOperationException that names this module.
dependencies {
    api projects.micronautCdi
    // the reflection module of Micronaut, which answers the accessors of an interceptor's InvocationContext that
    // return an object of the Java reflection API: the method, the constructor and the binding annotations. An
    // application asks for reflection by adding this module, and gets the whole of it
    api mn.micronaut.reflection

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
