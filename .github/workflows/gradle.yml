name: Java CI

on:
  push:
    branches:
      - main
  # every pull request, a stacked one into another branch included
  pull_request:
  schedule:
    # Micronaut Core is a snapshot and Jakarta Interceptors is the head of its branch, so a build that passed
    # can start failing with no change here: a nightly build says so before the next change runs into it
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # check runs the unit tests, the test suites, the kit's scenarios and the signature test of the API
      - name: Build and test
        run: ./gradlew check --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/build/reports/tests/'
          retention-days: 7
