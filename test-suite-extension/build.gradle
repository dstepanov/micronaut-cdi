plugins {
    id "io.micronaut.build.internal.cdi-base"
    id 'java-library'
}

// A build compatible extension, and the annotations it looks for. It is a library rather than a test suite
// because of where it has to be: an extension of this kind runs while the classes it enhances are compiled, so
// it goes on the annotation processor path of the project that uses it rather than on its classpath.
dependencies {
    api libs.managed.jakarta.cdi.api
}
