// Download and compile the upstream tests without annotation processing. Each Arquillian archive is
// subsequently compiled with the CDI processors; invalid-deployment tests must reach deployment first.
configurations {
    upstreamSources { canBeConsumed = false; transitive = false }
}
dependencies {
    testImplementation platform(libs.junit.bom)
    upstreamSources "${mpTck.artifact}:${mpTck.sourceClassifier}@jar"
    testImplementation mpTck.artifact
    if (mpTck.component == 'jwt') testImplementation "${mpTck.artifact}:tests@jar"
    testImplementation projects.micronautMicroprofileTckSupport
    testRuntimeOnly 'org.jboss.weld.se:weld-se-core:6.0.4.Final'
    testImplementation libs.testng
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    if (mpTck.framework == 'junit4') {
        testImplementation 'org.jboss.arquillian.junit:arquillian-junit-container:1.9.1.Final'
        testImplementation 'junit:junit:4.13.2'
    }
}
def unpack = tasks.register('upstreamTck', Sync) {
    from({ configurations.upstreamSources.files.collect { zipTree(it) } })
    into layout.buildDirectory.dir('upstream')
}
sourceSets.test.java.srcDir(unpack)
sourceSets.test.resources.srcDir(layout.buildDirectory.dir('upstream'))
tasks.named('processTestResources') {
    dependsOn unpack
    exclude '**/*.java'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-proc:none'] }

def suiteFile = layout.buildDirectory.file('suite.xml')
def suite = tasks.register('upstreamSuite') {
    dependsOn unpack, tasks.named('testClasses')
    inputs.files(sourceSets.test.output.classesDirs)
    inputs.files(sourceSets.test.runtimeClasspath)
    inputs.dir(layout.buildDirectory.dir('upstream'))
    inputs.property('component', mpTck.component)
    inputs.property('framework', mpTck.framework)
    outputs.file(suiteFile)
    outputs.file(layout.buildDirectory.file('selected-tests.txt'))
    outputs.file(layout.buildDirectory.file('test-discovery.tsv'))
    doLast {
        def classes = []
        def inventory = []
        def urls = sourceSets.test.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        // Inspect compiled binaries without initialization. This includes inherited tests, class-level
        // TestNG annotations and factories that a source-only @Test expression silently omitted.
        def loader = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            fileTree(layout.buildDirectory.dir('upstream')).matching { include '**/*.java' }.files.sort { it.path }.each { source ->
                def code = source.text
                def pkg = (code =~ /(?m)^\s*package\s+([\w.]+)\s*;/)
                def type = (code =~ /(?m)^\s*public\s+(?:(?:final|abstract|strictfp)\s+)*class\s+(\w+)/)
                if (!pkg.find() || !type.find()) {
                    inventory << "${source.name}\tdeclaration is not a public class"
                    return
                }
                def name = "${pkg.group(1)}.${type.group(1)}"
                def candidate = Class.forName(name, false, loader)
                def concrete = !java.lang.reflect.Modifier.isAbstract(candidate.modifiers)
                def annotations = candidate.annotations.collect { it.annotationType().name }
                def testAnnotations = mpTck.framework == 'junit4' ? ['org.junit.Test'] : ['org.testng.annotations.Test', 'org.testng.annotations.Factory']
                def methods = candidate.methods.findAll { method ->
                    method.annotations.any { annotation -> testAnnotations.contains(annotation.annotationType().name) }
                }
                def selected = concrete && (annotations.any { testAnnotations.contains(it) } || !methods.isEmpty())
                if (selected) classes << name
                inventory << "${name}\t${selected ? 'selected' : concrete ? 'support class' : 'abstract class'}\t${methods.collect { it.declaringClass.name + '#' + it.name }.sort().join(',')}"
            }
            if (mpTck.component == 'reactive-streams') classes << 'io.micronaut.cdi.mptck.streams.SmallRyeStreamsTck'
        } finally { loader.close() }
        classes = classes.unique().sort()
        if (classes.isEmpty()) throw new GradleException("No concrete upstream test classes selected for ${mpTck.component}")
        layout.buildDirectory.file('test-discovery.tsv').get().asFile.text = 'class\tselection\ttest-or-factory-methods\n' + inventory.join('\n') + '\n'
        suiteFile.get().asFile.text = '<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n' +
            '<suite name="MicroProfile ' + mpTck.component + '" verbose="0"><test name="Upstream"><classes>\n' +
            classes.sort().collect { '  <class name="' + it + '"/>' }.join('\n') +
            '\n</classes></test></suite>\n'
        layout.buildDirectory.file('selected-tests.txt').get().asFile.text = classes.sort().join('\n') + '\n'
    }
}
['tckSuite': 'native', 'tckImportedSuite': 'imported', 'tckReferenceSuite': 'reference'].each { taskName, mode ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs the unmodified ${mpTck.component} TCK (${mode} integration)."
        dependsOn suite, tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        if (mpTck.framework == 'junit4') {
            useJUnit()
            scanForTestClasses = false
        } else {
            useTestNG()
            scanForTestClasses = false
        }
        failOnNoDiscoveredTests = true
        maxHeapSize = '2g'
        maxParallelForks = 1
        // Each test class gets a clean loader. Compiled library definitions may contain deployment-specific
        // metadata and cannot be redefined in another archive's runtime package in the same JVM.
        forkEvery = 1
        ignoreFailures = providers.gradleProperty('mpTckIgnoreFailures').isPresent()
        outputs.upToDateWhen { false }
        systemProperty 'mp.tck.component', mpTck.component
        systemProperty 'mp.tck.mode', mode
        systemProperty 'mp.tck.sources', layout.buildDirectory.dir('upstream').get().asFile.absolutePath
        systemProperty 'mp.tck.evidence', layout.buildDirectory.dir("deployments/${mode}").get().asFile.absolutePath
        systemProperty 'smallrye.faulttolerance.mp-compatibility', 'true'
        doFirst {
            def selected = layout.buildDirectory.file('selected-tests.txt').get().asFile.readLines().findAll { !it.isBlank() }
            def requested = new LinkedHashSet(filter.includePatterns)
            // TestNG runs @BeforeClass even for classes whose methods a Gradle --tests filter excludes.
            // Prune class files as well, so a focused run does not deploy every unrelated TCK archive.
            if (filter.metaClass.hasProperty(filter, 'commandLineIncludePatterns')) requested.addAll(filter.commandLineIncludePatterns)
            if (!requested.isEmpty()) {
                def methodInventory = layout.buildDirectory.file('test-discovery.tsv').get().asFile.readLines().drop(1)
                    .findAll { it.contains('\tselected\t') }.collectEntries { line ->
                        def columns = line.split('\t', -1)
                        [(columns[0]): columns[2].split(',').findAll { !it.isBlank() }.collect { it.substring(it.lastIndexOf('#') + 1) }]
                    }
                selected = selected.findAll { name ->
                    requested.any { pattern ->
                        def regex = pattern.split('\\*', -1).collect { java.util.regex.Pattern.quote(it) }.join('.*')
                        def simple = name.substring(name.lastIndexOf('.') + 1)
                        name.matches(regex) || simple.matches(regex) || pattern.startsWith(name + '.') || pattern.startsWith(simple + '.')
                            || methodInventory.getOrDefault(name, []).any { method -> (name + '.' + method).matches(regex) || (simple + '.' + method).matches(regex) }
                    }
                }
            }
            if (selected.isEmpty()) throw new GradleException("No upstream test classes match requested filters: ${requested}")
            include selected.collect { it.replace('.', '/') + '.class' }
            delete layout.buildDirectory.dir("deployments/${mode}")
            systemProperty 'mp.tck.classpath', classpath.asPath
            def manifest = layout.buildDirectory.file("artifacts-${mode}.tsv").get().asFile
            manifest.text = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { a ->
                def hash = java.security.MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex()
                "${a.moduleVersion.id}\t${a.file.name}\t${hash}"
            }.sort().join('\n') + '\n'
        }
    }
}
// Keep these diagnostic suites opt-in even when this project's ordinary check task is selected.
tasks.named('test') { enabled = false }
