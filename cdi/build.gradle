plugins {
    id "io.micronaut.build.internal.cdi-module"
}

// Resolving and injecting a bean reads nothing back from a class: what a bean is, what an observer observes and how a
// class relates to the types above it were recorded while it was compiled, and the container holds each type as a
// Micronaut Argument. No class, package or call is allowed reflection. The interfaces of the specification are written
// in java.lang.reflect.Type, and a type a program hands in is read into an argument by Micronaut (Argument.of(Type)),
// which calls only the accessors of the type; a type the container reports is the one Micronaut renders an argument
// into (Argument.asType), which reads no class either. Reading a class back - its hierarchy, its members, its
// annotations - is what the optional micronaut-cdi-reflection module does where an application asks. Anything else,
// anywhere, fails the build.

dependencies {
    annotationProcessor libs.managed.micronaut.jakarta.interceptors.processor

    api libs.managed.jakarta.cdi.api
    // the bean manager is an ELAwareBeanManager, as it was a BeanManager with the expression-language methods in
    // CDI 4.1: CDI 5.0 moved them to this supplemental API, which brings the Expression Language API as the CDI 4.1
    // API did. Evaluating an expression is still the optional micronaut-cdi-el module's
    api libs.managed.jakarta.cdi.el.api
    api libs.managed.jakarta.inject.api
    api libs.managed.jakarta.annotation.api
    api libs.managed.jakarta.interceptor.api
    api libs.managed.micronaut.jakarta.interceptors
    api projects.micronautCdiMetadata
    api mn.micronaut.core
    api mn.micronaut.aop
    api mn.micronaut.inject
    api mn.micronaut.context

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
