pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.0.1'
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'cdi-parent'

include 'cdi'
include 'cdi-bom'
include 'cdi-el'
include 'cdi-processor'
include 'cdi-reflection'
include 'cdi-tck'
include 'test-suite-extension'
include 'test-suite-java'

// Jakarta Interceptors and Jakarta Expression Language are implemented by sibling projects rather than again here:
// the interception of a bean and the evaluation of an expression are the business of their own specifications, and
// Contexts and Dependency Injection defers to them. This builds against the branches of theirs it is developed with,
// as included builds, so that the coordinates they publish are substituted for their projects whatever version the
// catalog names. Each branch is cloned beside the build the first time it is needed and left as it is afterwards:
// `git -C .included-builds/<name>-<branch> pull` brings one up to date. A checkout of your own is used instead when its
// directory is given, with -PjakartaInterceptorsDir=... or -PjakartaElDir=...
def includedCheckout = { String property, String name, String url, String branch ->
    def given = providers.gradleProperty(property).orNull
    if (given != null) {
        def dir = file(given)
        if (!dir.directory) {
            throw new GradleException("${property} names ${dir}, which is not a directory")
        }
        return dir
    }
    def dir = file("${rootDir}/.included-builds/${name}-${branch.replace('/', '-')}")
    if (!dir.directory) {
        logger.lifecycle("Cloning the ${branch} branch of ${url} into ${dir}")
        def process = new ProcessBuilder('git', 'clone', '--branch', branch, '--single-branch', url, dir.absolutePath)
            .inheritIO()
            .start()
        if (process.waitFor() != 0) {
            throw new GradleException("Could not clone the ${branch} branch of ${url} into ${dir}; "
                + "clone it there yourself, or name a checkout with -P${property}=...")
        }
    }
    return dir
}

// the branch of dstepanov/micronaut-jakarta-interceptors#5, which destroys an object's interceptor instances with
// the object; back to main once it is merged
includeBuild(includedCheckout('jakartaInterceptorsDir', 'micronaut-jakarta-interceptors',
    'https://github.com/dstepanov/micronaut-jakarta-interceptors.git', 'claude/interceptor-instance-lifecycle'))
includeBuild(includedCheckout('jakartaElDir', 'micronaut-jakarta-el',
    'https://github.com/micronaut-projects/micronaut-jakarta-el.git', '1.1.x'))

micronautBuild {
    useStandardizedProjectNames.set(true)
    importMicronautCatalog()
}
