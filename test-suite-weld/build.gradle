plugins {
    id "io.micronaut.build.internal.cdi-test-suite"
}

// The assignability unit tests of Weld, the reference implementation of the specification, run against the
// typesafe resolution rules of this one.
//
// Section 2.4.2 says when a bean type or an event type is assignable to a required type, and the kit checks it
// through beans and observers. Weld holds its own reading of the rules to a table of type pairs as well - raw
// types, parameterized types, arrays, wildcards, type variables bounded by other type variables - which is a
// second opinion on the same rules, written by the people who wrote the specification, and worth having here.
//
// The two test classes, with the types they build their pairs from, reach Weld through one method, AssignabilityRules.matches(Type, Type), and two helpers,
// which are what org.jboss.weld under src/test stands in for: the rules are answered by CdiAssignability. Weld
// does not publish its test sources, so the two files are fetched from its repository at a fixed commit, as the
// kit's are fetched from Maven Central; nothing is vendored. They are Apache 2.0 licensed, as this project is.
def weldCommit = '8a297f72b939b738085764c3c69e72570b4b1aa3'
// the two test classes, and the three types they build their type pairs out of
def weldTests = [
    'BeanTypeAssignabilityTest',
    'EventTypeAssignabilityTest',
    'Foo',
    'Bar',
    'Baz',
]

def weldSources = tasks.register('weldSources') {
    description = "Fetches Weld's assignability unit tests at commit ${weldCommit.take(7)}."
    def target = layout.buildDirectory.dir('generated/weld')
    def dir = 'org/jboss/weld/tests/unit/reflection/util'
    inputs.property('commit', weldCommit)
    inputs.property('tests', weldTests)
    outputs.dir(target)
    doLast {
        def into = target.get().dir(dir).asFile
        into.mkdirs()
        weldTests.each { name ->
            def file = new File(into, "${name}.java")
            file.withOutputStream { out ->
                new URI("https://raw.githubusercontent.com/weld/core/${weldCommit}/impl/src/test/java/${dir}/${name}.java")
                    .toURL().withInputStream { from -> out << from }
            }
        }
    }
}

sourceSets.test.java.srcDir weldSources

dependencies {
    testImplementation projects.micronautCdi
    testImplementation libs.managed.jakarta.cdi.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit4
    testRuntimeOnly libs.junit.vintage.engine
}
