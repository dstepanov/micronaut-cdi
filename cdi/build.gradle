plugins {
    id "io.micronaut.build.internal.cdi-module"
}

// Resolving and injecting a bean reads nothing back from its class: what a bean is was decided while it was compiled.
// The reflection allowed below is what the interfaces of the specification are written in - a bean type is a
// java.lang.reflect.Type, a qualifier an annotation instance, an injection point a Member. The phases of a build
// compatible extension need none: they run while the application compiles, and what they described is read here
// from what was compiled. Each class is allowed only the kinds of reflection it reaches for, so that anything
// new, anywhere, fails the build until it is either removed or listed here with its reason.
noReflection {
    // the types of the specification's typesafe resolution: a bean type or a required type is a
    // java.lang.reflect.Type, and its arguments and bounds are what section 2.4.2 compares
    allowIn 'io.micronaut.cdi.runtime.CdiAssignability', 'GENERIC_SIGNATURES'
    allowIn 'io.micronaut.cdi.runtime.CdiParameterizedType', 'GENERIC_SIGNATURES'
    // the bounds of a type variable are recorded by name and loaded when a Type is asked for
    allowIn 'io.micronaut.cdi.runtime.CdiTypes', 'GENERIC_SIGNATURES', 'CLASS_LOADING'
    allowIn 'io.micronaut.cdi.runtime.CdiInjectionPointFactory', 'GENERIC_SIGNATURES'
    // the bean types of a bean are the closure of its class hierarchy as Types (section 2.2.1), and its scope
    // annotation is recorded by name
    allowIn 'io.micronaut.cdi.runtime.CdiBean', 'GENERIC_SIGNATURES', 'CLASS_LOADING'
    // the observed type keeps the wildcards and variables the compiled argument erases, and is read once per observer
    allowIn 'io.micronaut.cdi.runtime.CdiObserverMethod', 'GENERIC_SIGNATURES', 'CLASS_MEMBERS'
    // the event type of a fired event is its runtime class, and a qualifier handed over is an annotation instance
    allowIn 'io.micronaut.cdi.runtime.CdiEvent', 'GENERIC_SIGNATURES', 'ANNOTATIONS'

    // the bean manager is asked about annotation classes a program hands it: whether one is a scope, a qualifier,
    // a stereotype or an interceptor binding, and what a stereotype carries
    allowIn 'io.micronaut.cdi.runtime.CdiBeanContainer', 'ANNOTATIONS', 'GENERIC_SIGNATURES'
    allowIn 'io.micronaut.cdi.runtime.CdiInstance', 'ANNOTATIONS'
    allowIn 'io.micronaut.cdi.runtime.CdiInterceptor', 'ANNOTATIONS', 'CLASS_LOADING'
    allowIn 'io.micronaut.cdi.runtime.ExtensionQualifiers', 'ANNOTATIONS'
    // a qualifier is an annotation instance on the specification's side, materialized from what was compiled
    allowIn 'io.micronaut.cdi.runtime.CdiQualifiers', 'ANNOTATIONS', 'CLASS_LOADING', 'CLASS_MEMBERS'
    allowIn 'io.micronaut.cdi.runtime.CdiAnnotations', 'ANNOTATIONS', 'CLASS_MEMBERS'
    // an invoker built at build time names its bean class, which is loaded when the invoker is first used
    allowIn 'io.micronaut.cdi.runtime.RecordedInvoker', 'CLASS_LOADING'

    // a type an extension composed while the application compiled is handed out as the java.lang.reflect.Type
    // the specification's interfaces are written in, composed from the classes that were recorded
    allowIn 'io.micronaut.cdi.runtime.extension.RecordedTypes', 'GENERIC_SIGNATURES'
}

dependencies {
    annotationProcessor libs.managed.micronaut.jakarta.interceptors.processor

    api libs.managed.jakarta.cdi.api
    api libs.managed.jakarta.inject.api
    api libs.managed.jakarta.annotation.api
    api libs.managed.jakarta.interceptor.api
    api libs.managed.micronaut.jakarta.interceptors
    api mn.micronaut.core
    api mn.micronaut.aop
    api mn.micronaut.inject
    api mn.micronaut.context

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
